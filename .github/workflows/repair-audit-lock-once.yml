name: Repair audit lock once

# Temporary branch-only bootstrap. The repair commit removes this workflow.
on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read

concurrency:
  group: repair-audit-lock-once
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'EffortlessMetrics/uselesskey' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/ci-audit-dependency-floor'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - name: Regenerate only the two affected dependency entries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:Cargo.lock)" = c2ef1dbb96ee0a1cf9895c15709db6b52f096717
          test "$(git rev-parse HEAD:Cargo.toml)" = 06ea720e29a345043abeb841d001c1208aba63da
          cargo update -p anyhow --precise 1.0.103
          cargo update -p crossbeam-epoch --precise 0.9.20
          python3 - <<'PY'
          import pathlib
          import subprocess
          import tomllib

          original = tomllib.loads(subprocess.check_output(
              ['git', 'show', 'HEAD:Cargo.lock'], text=True))
          updated = tomllib.loads(pathlib.Path('Cargo.lock').read_text())
          targets = {
              'anyhow': ('1.0.102', '1.0.103',
                         '2a4385e2e34eb35d6b3efe798b9eb88096925d87726c0798709bf56d9ed84af3'),
              'crossbeam-epoch': ('0.9.18', '0.9.20',
                                  '2d6914041f254d6e9176c01941b21115dcfb7089e55135a35411081bd106ef3f'),
          }
          expected = tomllib.loads(subprocess.check_output(
              ['git', 'show', 'HEAD:Cargo.lock'], text=True))
          for name, (old_version, new_version, checksum) in targets.items():
              entries = [p for p in expected['package'] if p['name'] == name]
              if len(entries) != 1 or entries[0]['version'] != old_version:
                  raise SystemExit(f'unexpected original lock entry for {name}')
              entries[0]['version'] = new_version
              entries[0]['checksum'] = checksum
          if updated != expected:
              raise SystemExit('Cargo changed more than the two approved version/checksum pairs')
          if original == updated:
              raise SystemExit('expected lock repair is missing')

          manifest = pathlib.Path('Cargo.toml')
          content = manifest.read_text()
          before = 'anyhow = "1.0.102"'
          if content.count(before) != 1:
              raise SystemExit('anyhow manifest floor moved; stop for review')
          manifest.write_text(content.replace(before, 'anyhow = "1.0.103"', 1))
          PY
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          cargo fmt --all -- --check
          git diff --check
      - name: Commit the repair and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git add -- Cargo.toml Cargo.lock
          git rm -- .github/workflows/repair-audit-lock-once.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix(deps): resolve anyhow and crossbeam-epoch advisories"
          git push origin HEAD:refs/heads/fix/ci-audit-dependency-floor
