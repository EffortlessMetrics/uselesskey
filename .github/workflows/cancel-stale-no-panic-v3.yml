name: Cancel stale no-panic v3 bootstrap runs

on:
  push:
    branches:
      - campaign/no-panic-controller-v3-cancel-stale

permissions:
  actions: write
  contents: read

concurrency:
  group: cancel-stale-no-panic-v3
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  REPO: EffortlessMetrics/uselesskey

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Cancel obsolete bootstrap and generated controller runs
        shell: bash
        run: |
          set -euo pipefail
          cancel_run() {
            local id="$1"
            local status="$2"
            if [ "$status" = "queued" ] || [ "$status" = "in_progress" ] || [ "$status" = "waiting" ] || [ "$status" = "requested" ]; then
              gh api --method POST "/repos/$REPO/actions/runs/$id/cancel" >/dev/null 2>&1 || true
              echo "cancelled stale run $id"
            fi
          }

          for _ in $(seq 1 1080); do
            old_payload="$(gh api '/repos/EffortlessMetrics/uselesskey/actions/runs?branch=campaign%2Fno-panic-controller-v3-bootstrap&per_page=20')"
            while IFS=$'\t' read -r id status; do
              [ -n "$id" ] && cancel_run "$id" "$status"
            done < <(jq -r '.workflow_runs[] | [.id, .status] | @tsv' <<<"$old_payload")

            v3_payload="$(gh api '/repos/EffortlessMetrics/uselesskey/actions/runs?branch=campaign%2Fno-panic-controller-v3&per_page=20')"
            while IFS=$'\t' read -r id status message; do
              if [ "$message" = "chore: add serial no-panic campaign controller v3" ]; then
                cancel_run "$id" "$status"
              fi
            done < <(jq -r '.workflow_runs[] | [.id, .status, (.head_commit.message // "")] | @tsv' <<<"$v3_payload")

            fixed="$(gh api '/repos/EffortlessMetrics/uselesskey/actions/runs?branch=campaign%2Fno-panic-controller-v3-bootstrap-fix&per_page=1')"
            fixed_status="$(jq -r '.workflow_runs[0].status // "missing"' <<<"$fixed")"
            fixed_conclusion="$(jq -r '.workflow_runs[0].conclusion // ""' <<<"$fixed")"
            if [ "$fixed_status" = "completed" ]; then
              echo "corrected bootstrap completed: $fixed_conclusion"
              exit 0
            fi
            sleep 10
          done
          echo "timed out before corrected bootstrap completed" >&2
          exit 1
