name: Watch no-panic fixed serial controller 1

on:
  push:
    branches:
      - campaign/no-panic-fixed-1-watch

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: no-panic-fixed-1-watch
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  REPO: EffortlessMetrics/uselesskey

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Wait and retry failed jobs once
        id: run
        shell: bash
        run: |
          set -euo pipefail
          latest() {
            gh api '/repos/EffortlessMetrics/uselesskey/actions/runs?branch=campaign%2Fno-panic-fixed-1&per_page=1'
          }
          payload=""
          for _ in $(seq 1 1260); do
            payload="$(latest)"
            if [ "$(jq -r '.total_count // 0' <<<"$payload")" != "0" ] && [ "$(jq -r '.workflow_runs[0].status' <<<"$payload")" = "completed" ]; then
              break
            fi
            sleep 10
          done
          run_id="$(jq -r '.workflow_runs[0].id // empty' <<<"$payload")"
          conclusion="$(jq -r '.workflow_runs[0].conclusion // empty' <<<"$payload")"
          attempt="$(jq -r '.workflow_runs[0].run_attempt // 1' <<<"$payload")"
          test -n "$run_id"
          first="$conclusion"

          if [ "$conclusion" = "failure" ] && [ "$attempt" = "1" ]; then
            gh api --method POST "/repos/$REPO/actions/runs/$run_id/rerun-failed-jobs" >/dev/null
            for _ in $(seq 1 1260); do
              payload="$(latest)"
              status="$(jq -r '.workflow_runs[0].status' <<<"$payload")"
              attempt="$(jq -r '.workflow_runs[0].run_attempt // 1' <<<"$payload")"
              if [ "$status" = "completed" ] && [ "$attempt" -gt 1 ]; then
                break
              fi
              sleep 10
            done
            conclusion="$(jq -r '.workflow_runs[0].conclusion // empty' <<<"$payload")"
            attempt="$(jq -r '.workflow_runs[0].run_attempt // 1' <<<"$payload")"
          fi

          echo "id=$run_id" >> "$GITHUB_OUTPUT"
          echo "first=$first" >> "$GITHUB_OUTPUT"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          echo "attempt=$attempt" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r '.workflow_runs[0].head_sha' <<<"$payload")" >> "$GITHUB_OUTPUT"

      - name: Persist watchdog receipt
        shell: bash
        env:
          RUN_ID: ${{ steps.run.outputs.id }}
          FIRST: ${{ steps.run.outputs.first }}
          CONCLUSION: ${{ steps.run.outputs.conclusion }}
          ATTEMPT: ${{ steps.run.outputs.attempt }}
          HEAD_SHA: ${{ steps.run.outputs.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          gh api "/repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" > diagnostics/no-panic-fixed-1-jobs.json
          gh api "/repos/$REPO/branches/main" > diagnostics/no-panic-fixed-1-main.json
          gh api "/repos/$REPO/pulls?state=open&per_page=100" > diagnostics/no-panic-fixed-1-open-prs.json
          if [ "$CONCLUSION" != "success" ]; then
            gh run view "$RUN_ID" --repo "$REPO" --log-failed > diagnostics/no-panic-fixed-1-failed.log 2>&1 || true
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          jobs = json.loads(Path('diagnostics/no-panic-fixed-1-jobs.json').read_text())
          main = json.loads(Path('diagnostics/no-panic-fixed-1-main.json').read_text())
          prs = json.loads(Path('diagnostics/no-panic-fixed-1-open-prs.json').read_text())
          payload = {
              'schema_version': 1,
              'run_id': int(os.environ['RUN_ID']),
              'head_sha': os.environ['HEAD_SHA'],
              'first_conclusion': os.environ['FIRST'],
              'final_conclusion': os.environ['CONCLUSION'],
              'attempt': int(os.environ['ATTEMPT']),
              'main_sha': main['commit']['sha'],
              'jobs': [
                  {'id': job['id'], 'name': job['name'], 'status': job['status'], 'conclusion': job['conclusion']}
                  for job in jobs.get('jobs', [])
              ],
              'controlled_open_prs': [
                  {'number': pr['number'], 'title': pr['title'], 'head': pr['head']['ref'], 'head_sha': pr['head']['sha']}
                  for pr in prs
                  if pr['head']['ref'] == 'automation/badge-endpoints'
                  or pr['head']['ref'].startswith('test/no-panic-')
              ],
          }
          Path('diagnostics/no-panic-fixed-1-watch.json').write_text(json.dumps(payload, indent=2) + '\n')
          lines = [
              '# No-panic fixed controller 1 watchdog', '',
              f"- Run: **{payload['run_id']}**",
              f"- First conclusion: **{payload['first_conclusion']}**",
              f"- Final conclusion: **{payload['final_conclusion']}**",
              f"- Attempt: **{payload['attempt']}**",
              f"- Main: `{payload['main_sha']}`", '',
              '## Jobs', '', '| Job | Status | Conclusion |', '|---|---|---|',
          ]
          for job in payload['jobs']:
              lines.append(f"| {job['name']} | {job['status']} | {job['conclusion']} |")
          lines.extend(['', '## Controlled open pull requests', '', '| PR | Head | Title |', '|---:|---|---|'])
          for pr in payload['controlled_open_prs']:
              lines.append(f"| #{pr['number']} | `{pr['head']}` | {pr['title']} |")
          Path('diagnostics/no-panic-fixed-1-watch.md').write_text('\n'.join(lines) + '\n')
          PY
          git switch -C diagnostic/no-panic-fixed-1-watch
          git add diagnostics/no-panic-fixed-1-*
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git commit -m "chore: record no-panic fixed controller watchdog [skip ci]"
          git push --force origin diagnostic/no-panic-fixed-1-watch

      - name: Require successful fixed controller
        shell: bash
        run: |
          test "${{ steps.run.outputs.conclusion }}" = "success"
