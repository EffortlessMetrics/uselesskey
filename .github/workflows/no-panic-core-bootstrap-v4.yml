name: Bootstrap verified core no-panic burndown v4

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: no-panic-core-bootstrap-v4
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'chore/no-panic-core-test-burndown-bootstrap-v4'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Correct baseline-only arithmetic without mutating the worktree
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/bootstrap/run-no-panic-core.py').read_text(encoding='utf-8')
          old = 'assert sum(after_entries.values()) == 3422'
          assert source.count(old) == 1
          Path('/tmp/run-no-panic-core.py').write_text(
              source.replace(old, 'assert sum(after_entries.values()) == 3407', 1),
              encoding='utf-8',
          )
          PY

      - name: Generate and verify real five-file candidate
        run: python /tmp/run-no-panic-core.py
