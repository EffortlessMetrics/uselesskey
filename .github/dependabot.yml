version: 2
updates:
  # Canonical source does not originate routine dependency implementation.
  # Version-update candidates are owned by uselesskey-swarm and arrive here
  # only through a reviewed promotion. Security alerts remain enabled, while
  # automated security-fix PR generation is controlled in repository settings.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      # Preserve the shared dependency-policy record even though version-update
      # PR creation is disabled at the canonical boundary.
      - dependency-name: "rand"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "rand_core"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "rand_chacha"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
